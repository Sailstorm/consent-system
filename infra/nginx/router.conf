# URL versioning pipeline router. See docs/url-versioning-pipeline.md.
#
#   /                   -> frontend        (The LIVE Root: last complete iteration)
#   /underdevelopment/  -> frontend-dev    (Active Development: iteration in progress)
#   /version1/          -> static archive placeholder until an iteration is retired
#   /api/, /analyze     -> shared backend / ai-model services
#
# Both frontend containers proxy their own /api/ and /analyze locations too,
# but those never fire in production: this router matches first and owns the
# API paths so a single backend/db/ai-model stack serves every version.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /analyze {
        proxy_pass http://ai-model:8000/analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Active Development (Iteration N+1 in progress).
    location /underdevelopment/ {
        proxy_pass http://frontend-dev:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Archive. Empty until an iteration is retired here as part of the
    # cutover runbook in docs/url-versioning-pipeline.md.
    location /version1/ {
        default_type text/html;
        alias /usr/share/nginx/archive-placeholder/placeholder.html;
    }

    # The LIVE Root (always the last complete iteration).
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
