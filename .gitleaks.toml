# gitleaks configuration for the CI secret scan (.github/workflows/security.yml).
# Uses the default rules, plus one narrow exception for a known false
# positive: the generic-api-key rule reads the keyword "tokenizer" followed
# by "max_length=384" in developed_ai/ai/stage1_classifier.py as a key.
[extend]
useDefault = true

[allowlist]
description = "Known false positives"
regexTarget = "match"
regexes = ['''tokenizer,\s+max_length=\d+''']
paths = ['''^docs/''']
