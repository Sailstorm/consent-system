# Deploy-only overlay implementing the URL versioning pipeline. Not used for
# local dev (docker-compose.yml alone still works exactly as before). See
# docs/url-versioning-pipeline.md and infra/user_data.sh.tpl, which is what
# actually invokes this file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# It must be run from the "active development" checkout (main HEAD), with
# sibling `../app-stable` and `../app-archive` git worktrees checked out at
# the stable/archive refs (see infra/user_data.sh.tpl) — that's what the
# `frontend`/`frontend-archive` build contexts below point at.
services:
  # Overridden to be THE LIVE ROOT: rebuilt from the stable worktree (last
  # complete iteration) instead of this checkout. Doesn't publish a host
  # port (docker-compose.yml has none — only docker-compose.override.yml,
  # local-dev-only, adds one) since the router owns :80 in this overlay.
  frontend:
    build:
      context: ../app-stable/frontend
      # Built with THIS checkout's Dockerfile (non-root nginx, security
      # plan N-02) rather than the frozen ref's own, same approach as
      # frontend-archive below. The stable ref supports VITE_BASE_PATH, so
      # the generic Dockerfile builds it unchanged.
      dockerfile: ../../app/frontend/Dockerfile

  # Production-only settings for the shared services.
  backend:
    environment:
      NODE_ENV: production
      # The API only reads, so it connects as the read-only role created by
      # database/roles.sql (security plan D-03). The importers, run by
      # user_data.sh.tpl, override this with the owner role.
      DATABASE_URL: postgresql://consent_reader:${DB_READER_PASSWORD}@db:5432/consent_assistant
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Server-side site gate (security plan F-06).
      GATE_PASSWORD: ${GATE_PASSWORD}
      GATE_SECRET: ${GATE_SECRET}

  developed_ai:
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN}

  # Active Development: this checkout (the iteration in progress), served
  # under /underdevelopment/.
  frontend-dev:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_AI_URL: ""
        VITE_BASE_PATH: "/underdevelopment/"
    restart: unless-stopped
    depends_on:
      - backend
      - developed_ai

  # The Archive: a retired iteration, served under /version1/. Source is
  # the archive worktree (unmodified), but built via a Dockerfile that
  # lives in THIS checkout (infra/frontend-archive/Dockerfile) instead of
  # the archived one, since that code predates VITE_BASE_PATH support -
  # without a --base override there, its absolute-root asset paths
  # resolve against the domain root instead of /version1/ and 404 against
  # whatever the live root happens to be serving (rendered as a blank
  # page before this existed). The matching React Router basename comes
  # from the archive ref itself (iteration-1-archived patches
  # BrowserRouter basename="/version1/" onto iteration-1).
  frontend-archive:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ../app-archive/frontend
      dockerfile: ../../app/infra/frontend-archive/Dockerfile
    restart: unless-stopped

  # The Archive, part 2: Iteration 2, retired at the Iteration 3 cutover,
  # served under /version2/. That ref already supports VITE_BASE_PATH, so it
  # builds unpatched with this checkout's frontend Dockerfile (non-root
  # nginx), like the live root above.
  frontend-archive-2:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ../app-archive-2/frontend
      dockerfile: ../../app/frontend/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_AI_URL: ""
        VITE_BASE_PATH: "/version2/"
    restart: unless-stopped

  # Terminates TLS. Caddy requests/renews a Let's Encrypt cert for $DOMAIN
  # automatically (HTTP-01 on :80, which it also uses to redirect to
  # HTTPS) and persists it in the caddy-data volume across rebuilds.
  router:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build: ./infra/router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - frontend-dev
      - frontend-archive
      - frontend-archive-2
      - backend
      - developed_ai

volumes:
  caddy-data:
  caddy-config:
