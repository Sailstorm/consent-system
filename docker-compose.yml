services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: consent_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: consent_assistant
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent_app -d consent_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://consent_app:${POSTGRES_PASSWORD}@db:5432/consent_assistant
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  developed_ai:
    build:
      context: .
      dockerfile: developed_ai/Dockerfile
    restart: unless-stopped
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    networks:
      default:
        # The URL versioning pipeline's frozen "live root" build (the
        # stable git worktree, see docker-compose.prod.yml) has its own
        # nginx.conf baked in from whatever commit it's pinned to, which
        # may still hardcode the old "ai-model" hostname from before this
        # service was renamed. This alias keeps that historical build
        # working without editing the frozen snapshot.
        aliases:
          - ai-model

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_AI_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
      - developed_ai

volumes:
  db-data:
