services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: consent_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: consent_assistant
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent_app -d consent_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://consent_app:${POSTGRES_PASSWORD}@db:5432/consent_assistant
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  ai-model:
    build: ./ai-model
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_AI_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-model

volumes:
  db-data:
