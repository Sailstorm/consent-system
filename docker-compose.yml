# Shared container settings (security plan N-02, L-01):
# - rotate logs so a noisy service can't fill the disk
# - drop every Linux capability and block privilege escalation; none of the
#   app services need either (they run as non-root users, see each
#   Dockerfile). Postgres is excluded: its entrypoint needs to switch users.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-hardening: &hardening
  <<: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: consent_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: consent_assistant
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent_app -d consent_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Only on the internal database network: the AI service, frontends and
    # router can't reach Postgres at all, and the database has no route to
    # the internet (security plan D-02, TB3).
    networks:
      - database

  backend:
    <<: *hardening
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://consent_app:${POSTGRES_PASSWORD}@db:5432/consent_assistant
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - database

  developed_ai:
    <<: *hardening
    build:
      context: .
      dockerfile: developed_ai/Dockerfile
    restart: unless-stopped
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    networks:
      default:
        # The archived iteration-1 build (/version1/, see
        # docker-compose.prod.yml) has its own nginx.conf baked in from
        # that frozen ref, which still proxies to the old "ai-model"
        # hostname from before this service was renamed - nginx won't even
        # start if that name doesn't resolve. This alias keeps that build
        # working without editing the frozen snapshot.
        aliases:
          - ai-model

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_AI_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
      - developed_ai

networks:
  database:
    internal: true

volumes:
  db-data:
